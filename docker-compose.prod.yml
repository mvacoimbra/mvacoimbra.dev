services:
  mvacoimbra-web:
    image: mvacoimbra-web:latest
    pull_policy: never
    container_name: mvacoimbra-web
    restart: unless-stopped
    ports:
      - "3000"
    volumes:
      - /root/www/mvacoimbra.dev/src/modules/payload/data:/app/data
      - /root/www/mvacoimbra.dev/src/modules/payload/media:/app/media
    environment:
      - DATABASE_URI=file:/app/data/portfolio.db
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=https://mvacoimbra.dev.br
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mvacoimbra.rule=Host(`mvacoimbra.dev.br`)"
      - "traefik.http.routers.mvacoimbra.entrypoints=https"
      - "traefik.http.routers.mvacoimbra.tls=true"
      - "traefik.http.routers.mvacoimbra.tls.certresolver=letsencrypt"
      - "traefik.http.services.mvacoimbra.loadbalancer.server.port=3000"
      - "coolify.managed=true"

networks:
  coolify:
    external: true
